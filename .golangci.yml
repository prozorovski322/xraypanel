# golangci-lint configuration (v2 schema; the version is pinned in CI).
#
# Deliberately small. A large linter config becomes its own maintenance surface,
# and the linters that catch real defects here are a short list: the ones that find
# ignored errors, dropped contexts, and unclosed rows.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # The v2 "standard" set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - errorlint      # errors compared with == instead of errors.Is
    - bodyclose      # leaked HTTP response bodies
    - rowserrcheck   # rows.Err() unchecked, which silently truncates a result set
    - sqlclosecheck
    - noctx          # HTTP or SQL calls that drop the context
    - nilerr         # returning nil after a non-nil error
    - copyloopvar
    - durationcheck
    - gosec
    - misspell
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    gosec:
      excludes:
        # Weak-RNG detection. Every random value in this codebase comes from
        # crypto/rand, and the check misfires on call sites that only look similar.
        - G404
    revive:
      rules:
        # Doc comments are enforced by review, not by a linter that fires on every
        # unexported helper.
        - name: exported
          disabled: true
    # No locale: the code and its comments are written in British English, and the
    # point is to catch misspellings, not to convert one spelling to the other.
    misspell: {}
    staticcheck:
      # v2 folds stylecheck and the quickfix suggestions into staticcheck. Keep the scope
      # v1 had: the correctness (SA) and simplification (S) checks, not style.
      checks:
        - all
        - -ST*
        - -QF*

  exclusions:
    # The exclusions v1 applied by default.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests legitimately ignore errors in helpers and build long table literals;
      # security linting them adds noise without adding safety. The same goes for
      # threading a context through every exec, dial and test request.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xraypanel/panel

issues:
  # Report everything, not just the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0
