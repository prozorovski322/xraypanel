# golangci-lint configuration (v1 schema; the version is pinned in CI).
#
# Deliberately small. A large linter config becomes its own maintenance surface,
# and the linters that catch real defects here are a short list: the ones that find
# ignored errors, dropped contexts, and unclosed rows.

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - goimports
    - errorlint      # errors compared with == instead of errors.Is
    - bodyclose      # leaked HTTP response bodies
    - rowserrcheck   # rows.Err() unchecked, which silently truncates a result set
    - sqlclosecheck
    - noctx          # HTTP or SQL calls that drop the context
    - nilerr         # returning nil after a non-nil error
    - copyloopvar
    - durationcheck
    - gosec
    - misspell
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

linters-settings:
  goimports:
    local-prefixes: github.com/xraypanel/panel
  gosec:
    excludes:
      # Weak-RNG detection. Every random value in this codebase comes from
      # crypto/rand, and the check misfires on call sites that only look similar.
      - G404
  revive:
    rules:
      # Doc comments are enforced by review, not by a linter that fires on every
      # unexported helper.
      - name: exported
        disabled: true
  misspell:
    locale: US

issues:
  # Report everything, not just the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Tests legitimately ignore errors in helpers and build long table literals;
    # security linting them adds noise without adding safety.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
