name: Release images

# A version tag publishes the four images to GitHub Container Registry. Nothing else does:
# an image an operator pulls should correspond to a tag someone chose to cut.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # The same pins as CI, for the same reasons.
  XRAY_VERSION: "v26.3.27"

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance is signed with the workflow's identity.
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        image: [panel, web, backup, node]

    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: small VPSes on ARM are common, and exit nodes especially.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths must be lowercase; an owner name need not be.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # v1.2.3 is published as 1.2.3, 1.2 and latest. There is no floating major tag:
          # following 1 would upgrade across minor releases, which may carry migrations,
          # on whatever day a container is recreated.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            XRAY_VERSION=${{ env.XRAY_VERSION }}
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
