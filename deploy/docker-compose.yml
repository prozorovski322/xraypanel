# The panel in production: PostgreSQL, the panel, Caddy with the UI, and backups.
#
# On the server, next to this file:
#   cp panel.env.example .env      # and fill it in
#   docker compose up -d
#
# docs/deployment.md walks through it from a clean server.
#
# Two networks. "db" is internal: PostgreSQL, the migration job and the backup service have
# no business talking to the internet, and nothing on the internet can reach them. "edge"
# carries Caddy and the panel; the panel is on both. Its subnet is fixed because the panel
# has to be told which addresses are its proxy (HTTP_TRUSTED_PROXIES) — without that every
# client appears to come from Caddy, and the subscription rate limit would throttle all of
# them as one.

name: xraypanel

x-panel-image: &panel-image ${IMAGE_REGISTRY:-ghcr.io/prozorovski322}/panel:${XRAYPANEL_VERSION:-latest}

x-database-url: &database-url postgres://panel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/panel?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: panel
      # Deterministic collation, so ORDER BY does not depend on the host's locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Every timestamp is stored in UTC and traffic is bucketed by UTC hour.
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d panel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s

  # Migrations run once, before the panel starts, and the panel refuses to start on a schema
  # with pending migrations. An upgrade is therefore: pull, up -d — and a migration that
  # fails leaves the old panel's data untouched and the new panel not running.
  migrate:
    image: *panel-image
    command: ["migrate"]
    env_file: [.env]
    environment:
      APP_ENV: prod
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]
    restart: "no"

  panel:
    image: *panel-image
    command: ["serve"]
    restart: unless-stopped
    # Optional settings (limits, timeouts, billing timezone, ...) are read from .env; see the
    # root .env.example for the full list. The values below are the ones this layout fixes.
    env_file: [.env]
    environment:
      APP_ENV: prod
      DATABASE_URL: *database-url
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":8443"
      HTTP_TRUSTED_PROXIES: ${EDGE_SUBNET:-172.31.250.0/24}
    ports:
      # The node port, published directly. Nodes present client certificates, and a proxy
      # terminating that TLS would erase the identity the panel checks.
      - "${NODE_PORT:-8443}:8443"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [db, edge]
    # Long enough for node streams to close and in-flight requests to finish.
    stop_grace_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/prozorovski322}/web:${XRAYPANEL_VERSION:-latest}
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and the ACME account. Losing this volume means asking the CA again,
      # which is rate-limited: keep it.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      panel:
        condition: service_healthy
    networks: [edge]
    logging: *logging

  backup:
    image: ${IMAGE_REGISTRY:-ghcr.io/prozorovski322}/backup:${XRAYPANEL_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_MAX_AGE: ${BACKUP_MAX_AGE:-720h}
    volumes:
      - backups:/backups
    depends_on:
      # After the migrations: a dump of an empty schema would fail its own verification.
      migrate:
        condition: service_completed_successfully
    networks: [db]
    logging: *logging

networks:
  db:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.250.0/24}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # On the same disk as the database, so this is protection against mistakes, not against
  # losing the server. docs/deployment.md covers copying the dumps somewhere else.
  backups:
