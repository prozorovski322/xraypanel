syntax = "proto3";

package nodectl.v1;

option go_package = "github.com/xraypanel/panel/internal/nodectl/v1;nodectlv1";

// NodeControl is the only interface between the control plane and a node.
//
// The node dials the panel, never the reverse: nodes sit behind NAT, have no
// inbound management port, and their liveness is simply whether their stream is
// open. That makes the panel the gRPC server, and a node's identity the client
// certificate it presents (see docs/node-protocol.md).
service NodeControl {
    // Enroll exchanges a single-use enrollment token for a client certificate.
    //
    // This is the one method that accepts a connection without a client
    // certificate, because it is how a node obtains one. Everything else
    // requires mutual TLS.
    rpc Enroll(EnrollRequest) returns (EnrollResponse);

    // Control is the long-lived bidirectional stream a node keeps open for as
    // long as it is running. The panel pushes desired state down it and the node
    // reports back; an open stream is what "connected" means.
    rpc Control(stream NodeMessage) returns (stream PanelMessage);
}

// ------------------------------------------------------------------ enrollment

message EnrollRequest {
    // Token is the single-use secret an administrator issued for one node.
    string token = 1;

    // CsrPem is a PKCS#10 certificate request in PEM form.
    //
    // The node generates its own key pair and sends only the request, so the
    // private key never crosses the wire and the panel never holds it. The panel
    // takes the public key and ignores the requested subject: naming is the
    // panel's business, not the applicant's.
    string csr_pem = 2;

    // Advisory, recorded for the operator's benefit. Never trusted for any
    // decision: it is whatever the caller chose to send.
    string agent_version = 3;
    string hostname = 4;
}

message EnrollResponse {
    // CertificatePem is the issued client certificate.
    string certificate_pem = 1;

    // CaPem is the certificate authority the node must verify the panel against
    // on every later connection.
    string ca_pem = 2;

    // The identity the panel assigned. The node stores it for its own logs; the
    // panel re-derives it from the certificate on every connection rather than
    // believing what the node claims.
    int64 node_id = 3;
    string node_name = 4;

    // ServerName is the name the node must require in the panel's certificate.
    // It is a fixed internal name rather than the address being dialled, so that
    // moving the panel does not require reissuing certificates.
    string server_name = 5;

    // NotAfter is when this certificate stops being accepted, as RFC 3339. The
    // node logs it so an expiry is visible before it causes an outage.
    string not_after = 6;
}

// ------------------------------------------------------------- node -> panel

message NodeMessage {
    oneof payload {
        Hello hello = 1;
        Heartbeat heartbeat = 2;
        ApplyResult apply_result = 3;

        // Reserved for M9: batched traffic deltas. Declared here so that adding
        // it later is not a change to the shape of this message.
        TrafficBatch traffic_batch = 4;
    }
}

// Hello is the first message on every stream. The panel answers with HelloAck.
message Hello {
    string agent_version = 1;

    // XrayVersion is what the child process reports, or empty when it has not
    // started yet.
    string xray_version = 2;

    // AppliedVersion is the config version the node currently has running, or 0
    // when it has none. The panel uses it to decide whether the node is behind.
    int64 applied_version = 3;

    // StartedAt is when the agent process started, as RFC 3339.
    string started_at = 4;
}

message Heartbeat {
    // SentAt is the node's clock, as RFC 3339. It is recorded but not trusted:
    // the panel stamps its own arrival time, so a node with a wrong clock cannot
    // make itself look alive.
    string sent_at = 1;

    // XrayRunning is false when the supervisor has no healthy child process,
    // which is a node that is connected and not serving traffic.
    bool xray_running = 2;

    int64 applied_version = 3;

    // ActiveUsers is how many users the node currently has loaded into Xray.
    int64 active_users = 4;
}

// ApplyResult reports the outcome of an ApplyConfig. Implemented in M7.
message ApplyResult {
    int64 config_version = 1;
    bool ok = 2;

    // Error is empty when ok is true.
    string error = 3;

    // Restarted records whether the core had to be restarted, which is the
    // signal that a change was structural rather than a runtime user edit.
    bool restarted = 4;
}

// TrafficBatch carries traffic deltas. The batch id is what makes a retry after a
// reconnect safe to apply twice: the panel records it and ignores a batch it has
// already stored.
message TrafficBatch {
    string batch_id = 1;
    repeated TrafficDelta deltas = 2;
}

message TrafficDelta {
    // XrayEmail is the immutable stats key, not the username (ADR-007).
    string xray_email = 1;
    int64 uplink = 2;
    int64 downlink = 3;

    // Hour is the UTC hour the traffic is attributed to, as RFC 3339.
    string hour = 4;
}

// ------------------------------------------------------------- panel -> node

message PanelMessage {
    oneof payload {
        HelloAck hello_ack = 1;

        // The desired configuration.
        ApplyConfig apply_config = 2;

        // Confirmation that a traffic batch has been stored.
        TrafficAck traffic_ack = 3;
    }
}

// TrafficAck tells a node it may forget a batch.
//
// Without it a node could only guess: dropping a batch when the send succeeded would
// lose traffic whenever the panel failed to store it, and keeping every batch for ever
// would fill the node's volume. The node keeps a batch until this arrives and resends it
// on the next connection, which is safe because the panel deduplicates by batch id.
message TrafficAck {
    string batch_id = 1;

    // Stored is false when the panel could not store the batch; the node keeps it and
    // tries again. An already-known batch is reported as stored, because from the
    // node's point of view it is.
    bool stored = 2;

    // Error is for the node's log when stored is false.
    string error = 3;
}

message HelloAck {
    int64 node_id = 1;
    string node_name = 2;

    // DesiredVersion is the config version the panel wants running. When it
    // differs from what the node reported, an ApplyConfig follows.
    int64 desired_version = 3;

    // HeartbeatSeconds is how often the node should send a Heartbeat. The panel
    // owns this interval so it can be tuned without redeploying nodes.
    int32 heartbeat_seconds = 4;

    // PanelTime is the panel's clock as RFC 3339, so a node with a skewed clock
    // can say so in its logs.
    string panel_time = 5;
}

// ApplyConfig is the whole desired state of a node. Implemented in M7.
message ApplyConfig {
    int64 config_version = 1;

    // ConfigJson is the complete Xray configuration, already patched. Nodes hold
    // no configuration of their own (ADR-003).
    bytes config_json = 2;

    // StructuralHash covers everything except the user lists, so the node can
    // tell a change that needs a core restart from one that does not (ADR-009).
    string structural_hash = 3;

    // InboundHashes is keyed by inbound tag, for the same decision per inbound.
    map<string, string> inbound_hashes = 4;
}
